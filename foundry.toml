[profile.default]
src = "contracts/src"
test = "contracts/test"
script = "contracts/script"
out = "contracts/out"
cache_path = "contracts/cache"
libs = ["node_modules"]
allow_paths = ["node_modules"]
remappings = [
  "@gluwa/asc-contracts/=node_modules/@gluwa/asc-contracts/",
  "@openzeppelin/contracts/=node_modules/@openzeppelin/contracts/"
]
solc_version = "0.8.30"
evm_version = "shanghai"
optimizer = true
optimizer_runs = 200
via_ir = true

[lint]
lint_on_build = false
